services:
  postgres:
    image: postgres:18-alpine
    container_name: brownie-postgres
    environment:
      POSTGRES_DB: brownie
      POSTGRES_USER: brownie
      POSTGRES_PASSWORD: brownie
    volumes:
      - brownie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U brownie" ]
      interval: 5s
      timeout: 5s
      retries: 5
  nathan-brownie:
    build: .
    image: nathan-brownie:1.0
    container_name: nathan-brownie
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DB_URL: jdbc:postgresql://postgres:5432/brownie
      DB_USERNAME: brownie
      DB_PASSWORD: brownie

volumes:
  brownie-pgdata:
